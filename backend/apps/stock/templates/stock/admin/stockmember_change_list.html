{% extends "admin/change_list.html" %}

{% block content %}
<div class="module" style="margin-bottom: 14px; padding: 12px 16px; display: flex; gap: 28px; flex-wrap: wrap;">
  {% for item in signup_path_stats %}
  <div>
    <div style="font-size: 12px; color: #666;">{{ item.label }}</div>
    <div style="font-size: 22px; font-weight: 700;">{{ item.count }}</div>
  </div>
  {% endfor %}
</div>
{{ block.super }}
{% endblock %}
