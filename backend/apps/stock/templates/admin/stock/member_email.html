<!-- templates/admin/stock/member_email.html -->
{% extends "admin/base_site.html" %}
{% block content %}
<h2>선택 회원에게 메일 발송</h2>
<p style="color:#666;">아래 {{ members|length }}명에게 같은 제목/내용의 메일을 보냅니다.</p>

<ul style="margin-bottom:20px;">
  {% for member in members %}
  <li>{{ member.name }} &lt;{{ member.email }}&gt;</li>
  {% endfor %}
</ul>

<form method="post">
  {% csrf_token %}
  <input type="hidden" name="ids" value="{{ ids }}">
  <div style="margin-bottom:15px;">
    <label style="display:block; font-weight:bold; margin-bottom:5px;">제목</label>
    <input type="text" name="subject" style="width:100%; max-width:500px; padding:8px;" placeholder="메일 제목 (비워두면 기본 제목 사용)">
  </div>
  <div style="margin-bottom:15px;">
    <label style="display:block; font-weight:bold; margin-bottom:5px;">내용</label>
    <textarea name="message" rows="10" style="width:100%; max-width:600px; padding:8px;" required></textarea>
  </div>
  <a href="javascript:history.back()" class="button" style="background:#ccc; color:#333; margin-right:10px;">취소</a>
  <button type="submit" class="button" style="background:#417690; color:white; cursor:pointer;">발송</button>
</form>
{% endblock %}
